<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;display=swap');
      .initials {
        font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 196px;
        fill: #3b5323;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Clean Rounded Canvas (Cream Linen) -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="#fdfdfb" stroke="#3b5323" stroke-width="8" />
  <rect x="32" y="32" width="448" height="448" rx="84" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.7" />

  <!-- Monogram Initials T | P -->
  <g>
    <!-- Letter T -->
    <text x="142" y="305" class="initials">T</text>

    <!-- Center Vertical Line (Gold) -->
    <line x1="256" y1="130" x2="256" y2="330" stroke="#d4af37" stroke-width="7" stroke-linecap="round" />

    <!-- Letter P -->
    <text x="370" y="305" class="initials">P</text>
  </g>

  <!-- Minimalist Olive Leaf Divider Below -->
  <g transform="translate(256, 382) scale(1.3)" fill="#3b5323" stroke="#3b5323">
    <!-- Center Stem -->
    <path d="M 0,-25 Q 0,0 0,20" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Left Leaf -->
    <path d="M 0,0 Q -22,-12 -28,2 Q -12,18 0,0" fill="#3b5323" stroke-width="1" />
    <!-- Right Leaf -->
    <path d="M 0,0 Q 22,-12 28,2 Q 12,18 0,0" fill="#3b5323" stroke-width="1" />
    <!-- Small Gold Center Berry -->
    <circle cx="0" cy="0" r="4" fill="#d4af37" stroke="none" />
  </g>
</svg>